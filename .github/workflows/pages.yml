name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: stackui-site
      # The live demos run the library source, checked out next to the site (until @stackui/react is on npm).
      - uses: actions/checkout@v5
        with:
          repository: gustavopavaomt/stackui
          path: stackui
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stackui-site/package-lock.json
      # Install scripts stay off (also in .npmrc): a compromised dependency cannot run code on install.
      - run: npm ci --ignore-scripts
        working-directory: stackui-site
      - run: npm audit --audit-level=high
        working-directory: stackui-site
      - run: npm run build
        working-directory: stackui-site
        env:
          SITE_BASE: /stackui-site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: stackui-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
